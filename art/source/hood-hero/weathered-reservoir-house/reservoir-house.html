<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141817" />
    <link rel="icon" href="data:," />
    <title>Reservoir House · Hood Hero Lab</title>
  </head>
  <body>
    <main>
      <canvas
        id="scene"
        aria-label="Interactive exterior of the Reservoir house"
      ></canvas>
      <header class="panel heading">
        <p>HOOD HERO LAB / THE RESERVOIR</p>
        <h1>Weathered two-story</h1>
      </header>
      <div id="loading" class="panel" role="status">
        Loading house and textures…
      </div>
      <div id="joystick" aria-hidden="true" hidden><span></span></div>
      <section class="panel controls" aria-label="Preview controls" hidden>
        <div class="mode-row">
          <button type="button" id="walk" aria-pressed="false">Walk</button>
          <button type="button" id="orbit" aria-pressed="false">
            360° orbit
          </button>
          <button type="button" id="light" aria-pressed="false">Night</button>
        </div>
        <div class="inspect-row">
          <div class="view">
            <label for="view">View</label>
            <select id="view">
              <option value="front">Street</option>
              <option value="siding">Siding &amp; meter</option>
              <option value="windows">Windows</option>
              <option value="roof">Roof &amp; chimney</option>
              <option value="porch">Porch &amp; steps</option>
              <option value="side">Side entrance</option>
              <option value="rear">Rear elevation</option>
            </select>
          </div>
          <details>
            <summary>Performance</summary>
            <p id="stats">Sampling frame times…</p>
          </details>
        </div>
        <p id="help">Drag to rotate · Pinch or scroll to zoom</p>
      </section>
    </main>
    <script type="module" src="/src/showcases/reservoir-house/main.ts"></script>
  </body>
</html>
