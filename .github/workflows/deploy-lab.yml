name: Deploy Hood Hero Lab
# Publishes the experimental strategy board to this repository's own Pages
# site. It never touches the production Hood-Hero repository or its site.
#
# The site holds two builds:
#   /Hood-Hero-Lab/       Lab main (the current playable Lab)
#   /Hood-Hero-Lab/next/  the preview branch (PREVIEW_BRANCH), when it exists,
#                         with its own save slot so the two never share saves.
# Pushing to main deploys both. To refresh the preview after pushing the
# preview branch, run this workflow by hand on main (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  PREVIEW_BRANCH: claude/city-expansion
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /Hood-Hero-Lab/
      - name: Check for the preview branch
        id: preview
        run: |
          if git ls-remote --exit-code --heads origin "$PREVIEW_BRANCH" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.preview.outputs.exists == 'true'
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
          path: preview-src
      - name: Build the preview at /next/
        if: steps.preview.outputs.exists == 'true'
        working-directory: preview-src
        env:
          VITE_BASE_PATH: /Hood-Hero-Lab/next/
          VITE_SAVE_SUFFIX: .next
        run: |
          npm ci
          npm test
          npm run build
          mkdir -p ../dist/next
          cp -r dist/. ../dist/next/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
