<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="icon" href="data:," />
    <title>One Living Block · Lil Bit Lane Sim Preview</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-hud">
        <div class="hud-title">
          <h1>One Living Block</h1>
          <small id="hud-subtitle">Lil Bit Lane · 5 Autonomous NPCs</small>
        </div>
        <div class="hud-clock">
          <strong id="sim-clock" data-testid="sim-clock">Day 1 · 08:05</strong>
          <small id="sim-status" data-testid="sim-status">20 Hz Active · 1×</small>
        </div>
      </header>

      <main class="stage-wrap">
        <canvas id="sim-canvas" data-testid="sim-canvas"></canvas>
        <div id="offview-banner" class="offview-banner hidden" data-testid="offview-banner">
          <h2>Left Lil Bit Lane (1 Hz Persistent Sim)</h2>
          <p id="offview-summary">
            NPCs continue walking, running errands, and advancing schedules off-screen without resetting.
          </p>
          <button id="btn-return-banner" type="button" class="ctrl-btn active">
            Return to Lil Bit Lane
          </button>
        </div>
      </main>

      <section id="npc-strip" class="npc-strip" aria-label="Simulated NPCs"></section>
      <div id="inspector-slot" class="inspector-slot"></div>

      <footer class="bottom-controls" aria-label="Simulation Controls">
        <button id="btn-pause" type="button" class="ctrl-btn" data-testid="btn-pause">Pause</button>
        <button id="btn-speed" type="button" class="ctrl-btn" data-testid="btn-speed">Speed 1×</button>
        <button id="btn-area" type="button" class="ctrl-btn" data-testid="btn-area">Leave Block</button>
        <button id="btn-disturbance" type="button" class="ctrl-btn warn" data-testid="btn-disturbance">Disturbance</button>
        <button id="btn-view" type="button" class="ctrl-btn" data-testid="btn-view">View: Lil Bit</button>
        <button id="btn-nav" type="button" class="ctrl-btn active" data-testid="btn-nav">Nav Graph</button>
        <button id="btn-inspector" type="button" class="ctrl-btn" data-testid="btn-inspector">Inspector</button>
        <button id="btn-reset" type="button" class="ctrl-btn" data-testid="btn-reset">Reset Seed</button>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
